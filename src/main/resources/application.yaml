spring:
  application:
    name: woowahan-eats

  datasource:
    url: jdbc:postgresql://localhost:5432/woowahan_eats
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL}