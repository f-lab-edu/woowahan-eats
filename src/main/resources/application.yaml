spring:
  application:
    name: woowahan-eats

  datasource:
    url: jdbc:postgresql://localhost:5433/woowahan_eats
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: woowahan-eats

server:
  tomcat:
    mbeanregistry:
      enabled: true

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL}
