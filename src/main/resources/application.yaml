spring:
  application:
    name: woowahan-eats

  datasource:
    url: jdbc:postgresql://localhost:5433/woowahan_eats
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # ──────────────────────────────────────────────
  # Spring AI - Ollama (로컬 LLM) 설정
  # ──────────────────────────────────────────────
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        timeout: 120s
        pull-model-strategy: when_missing
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.0
          num-predict: 1024
      embedding:
        model: mxbai-embed-large
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1024

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, caches, beans
  metrics:
    tags:
      application: woowahan-eats

server:
  tomcat:
    mbeanregistry:
      enabled: true

# ──────────────────────────────────────────────
# 챗봇 튜닝 파라미터
# ──────────────────────────────────────────────
chatbot:
  retrieval:
    top-k: 3
    similarity-threshold: 0.5
  llm:
    max-retries: 2
    base-delay-ms: 1000
    rate-limit-delay-ms: 5000
  ingestion:
    chunk-size: 400
    chunk-overlap: 50

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL}
